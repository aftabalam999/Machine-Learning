<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House Rent Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="container">
        <h1>House Rent Predictor</h1>

        <form method="POST" action="/">
            <div class="grid">
                <div class="field">
                    <label for="city">City</label>
                    <select id="city" name="city" required>
                        <option value="">Select city</option>
                        <option value="Ahmedabad">Ahmedabad</option>
                        <option value="Bangalore">Bangalore</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Hyderabad">Hyderabad</option>
                        <option value="Kolkata">Kolkata</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Pune">Pune</option>
                    </select>
                </div>

                <div class="field">
                    <label for="bhk">BHK</label>
                    <input type="number" id="bhk" name="bhk" min="1" max="10" required />
                </div>

                <div class="field">
                    <label for="size_sqft">Size (sqft)</label>
                    <input type="number" id="size_sqft" name="size_sqft" step="0.01" min="200" required />
                </div>

                <div class="field">
                    <label for="bathrooms">Bathrooms</label>
                    <input type="number" id="bathrooms" name="bathrooms" min="1" max="10" step="0.5" required />
                </div>

                <div class="field">
                    <label for="property_type">Property Type</label>
                    <select id="property_type" name="property_type" required>
                        <option value="">Select property type</option>
                        <option value="Apartment">Apartment</option>
                        <option value="Independent House">Independent House</option>
                        <option value="Studio">Studio</option>
                        <option value="Villa">Villa</option>
                    </select>
                </div>

                <div class="field">
                    <label for="furnishing">Furnishing</label>
                    <select id="furnishing" name="furnishing" required>
                        <option value="">Select furnishing</option>
                        <option value="Fully Furnished">Fully Furnished</option>
                        <option value="Semi-Furnished">Semi-Furnished</option>
                        <option value="Unfurnished">Unfurnished</option>
                    </select>
                </div>

                <div class="field">
                    <label for="floor">Floor</label>
                    <select id="floor" name="floor" required>
                        <option value="">Select floor</option>
                        <option value="Ground">Ground</option>
                        <option value="High">High</option>
                        <option value="Low">Low</option>
                        <option value="Middle">Middle</option>
                    </select>
                </div>

                <div class="field">
                    <label for="property_age">Property Age (Years)</label>
                    <input type="number" id="property_age" name="property_age" min="0" max="50" required />
                </div>
            </div>

            <button type="submit">Predict Rent</button>
        </form>

        {% if error %}
            <div class="message error">
                {{ error }}
            </div>
        {% endif %}

        {% if prediction is not none %}
            <div class="result">
                <h2>Predicted Monthly Rent</h2>
                <p>₹ {{ prediction }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
